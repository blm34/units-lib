[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[project]
name = "units-lib"
dynamic = ["version"]
requires-python = ">=3.11"
description = "Library for managing calculations of quantities with units."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "blm34", email = "pypi.escalate394@passmail.net"},
]
keywords = ["units", "physics", "maths", "siunits"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.urls]
Homepage = "https://github.com/blm34/units-lib/"
Repository = "https://github.com/blm34/units-lib/"
Issues = "https://github.com/blm34/units-lib/issues"

[dependency-groups]
dev = [
    "ruff>=0.16.5",
    "ty>=0.0.78",
]
tests = [
    "hypothesis>=6.170.5",
    "pytest>=9.1.1",
]
